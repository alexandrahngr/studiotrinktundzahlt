<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Getränkeliste</title>
<style>
    body {
        background: #000;
        color: #fff;
        font-family: Arial, sans-serif;
        text-align: center;
        margin: 0;
        padding: 20px;
    }

    h1 {
        font-size: 2.5em;
        margin-bottom: 5px;
    }

    .subtext {
        font-size: 0.9em;
        color: #ccc;
        margin-bottom: 25px;
    }

    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 20px;
        max-width: 900px;
        margin: 0 auto;
    }

    .person {
        background: #111;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 0 10px #333;
    }

    .icon {
        font-size: 50px;
        margin-bottom: 10px;
    }

    .name {
        font-size: 1.2em;
        margin-bottom: 5px;
        display: block;
    }

    .count {
        font-size: 1.5em;
        margin-bottom: 5px;
        display: block;
    }

    .sum {
        font-size: 1em;
        color: #aaa;
        margin-bottom: 10px;
        display: block;
    }

    button {
        padding: 10px 18px;
        font-size: 1em;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        background: #444;
        color: #fff;
        transition: 0.2s;
        margin: 3px;
    }

    button:hover {
        background: #666;
    }

    .minus {
        background: #772222;
    }

    .minus:hover {
        background: #aa3333;
    }

    #exportBtn {
        margin-top: 30px;
        background: #1e6f1e;
    }

    #exportBtn:hover {
        background: #2a9a2a;
    }
</style>
</head>
<body>

<h1 id="title"></h1>
<div class="subtext">Ein Getränk aus der Kiste macht 1,50 € – Abrechnung erfolgt monatlich.</div>

<div class="grid" id="personen"></div>

<button id="exportBtn">Excel / CSV Export</button>

<script>
const PREIS = 1.50;

// Personen + Icons
const personenListe = [
    { name: "Person 1", icon: "🦊" },
    { name: "Person 2", icon: "🐼" },
    { name: "Person 3", icon: "🐵" },
    { name: "Person 4", icon: "🦁" },
    { name: "Person 5", icon: "🐸" },
    { name: "Person 6", icon: "🐧" },
    { name: "Person 7", icon: "🐢" },
    { name: "Person 8", icon: "🐯" },
    { name: "Person 9", icon: "🐶" },
    { name: "Person 10", icon: "🐱" }
];

// Monatstitel setzen
const jetzt = new Date();
const monatNamen = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
document.getElementById("title").textContent = "Getränkeliste – " + monatNamen[jetzt.getMonth()] + " " + jetzt.getFullYear();

// Monat prüfen und ggf. zurücksetzen
const aktuellerMonat = jetzt.getMonth();
const gespeicherterMonat = localStorage.getItem("monat");

if (gespeicherterMonat == null || gespeicherterMonat != aktuellerMonat) {
    localStorage.clear();
    localStorage.setItem("monat", aktuellerMonat);
}

// UI erzeugen
const container = document.getElementById("personen");

personenListe.forEach(person => {
    const countKey = "count_" + person.name;
    const count = Number(localStorage.getItem(countKey)) || 0;

    const div = document.createElement("div");
    div.className = "person";

    const summe = (count * PREIS).toFixed(2);

    div.innerHTML = `
        <div class="icon">${person.icon}</div>
        <span class="name">${person.name}</span>
        <span class="count" id="${countKey}">${count}</span>
        <span class="sum" id="sum_${countKey}">Summe: ${summe} €</span>
    `;

    // Plus-Button
    const plusBtn = document.createElement("button");
    plusBtn.textContent = "+1";
    plusBtn.onclick = () => {
        const neuerWert = (Number(localStorage.getItem(countKey)) || 0) + 1;
        localStorage.setItem(countKey, neuerWert);
        document.getElementById(countKey).textContent = neuerWert;
        document.getElementById("sum_" + countKey).textContent = "Summe: " + (neuerWert * PREIS).toFixed(2) + " €";
    };

    // Minus-Button
    const minusBtn = document.createElement("button");
    minusBtn.textContent = "-1";
    minusBtn.className = "minus";
    minusBtn.onclick = () => {
        let aktuellerWert = Number(localStorage.getItem(countKey)) || 0;
        if (aktuellerWert > 0) aktuellerWert--;
        localStorage.setItem(countKey, aktuellerWert);
        document.getElementById(countKey).textContent = aktuellerWert;
        document.getElementById("sum_" + countKey).textContent = "Summe: " + (aktuellerWert * PREIS).toFixed(2) + " €";
    };

    div.appendChild(plusBtn);
    div.appendChild(minusBtn);
    container.appendChild(div);
});

// CSV Export
document.getElementById("exportBtn").onclick = () => {
    let csv = "Person;Getränke;Summe (€);" + monatNamen[jetzt.getMonth()] + " " + jetzt.getFullYear() + "\n";

    personenListe.forEach(person => {
        const countKey = "count_" + person.name;
        const count = Number(localStorage.getItem(countKey)) || 0;
        const summe = (count * PREIS).toFixed(2);
        csv += `${person.name};${count};${summe};\n`;
    });

    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);

    const link = document.createElement("a");
    link.href = url;
    link.download = "getraenkeliste_" + jetzt.getFullYear() + "_" + (jetzt.getMonth()+1) + ".csv";
    link.click();
};
</script>

</body>
</html>
